[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    playwright: marks tests as requiring Playwright browser (skip in CI unless PLAYWRIGHT_ENABLED=1)
    ci_unavailable: marks tests whose required generated artifact, private credential, media asset, or local integration is unavailable in CI
    serial_only: marks tests that have no parallel-isolation evidence
