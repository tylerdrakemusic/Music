name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out Workspace repository
        uses: actions/checkout@v4
        with:
          repository: tylerdrakemusic/-Workspace
          path: workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Workspace root for shared imports
        run: |
          echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/workspace" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run bounded parallel and serial pytest lanes
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
        run: python tools/run_tests.py --parallel-junitxml tmp/pytest-parallel-junit.xml --serial-junitxml tmp/pytest-serial-junit.xml

      - name: Upload parallel JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-parallel
          path: tmp/pytest-parallel-junit.xml

      - name: Upload serial JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-serial
          path: tmp/pytest-serial-junit.xml

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io (guitartrainer)
        run: flyctl deploy --remote-only --app guitartrainer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

