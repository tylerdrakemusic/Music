name: test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # CI runtime budget — bump as test suite grows (FR-20260425)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce repository file-size policy
        shell: bash
        run: bash .github/scripts/check_tracked_file_sizes.sh "$GITHUB_WORKSPACE"

      - name: Resolve Workspace peer revision
        id: workspace_revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          repository=tylerdrakemusic/-Workspace
          remote="https://github.com/${repository}.git"
          default_ref=main
          selected_ref="$default_ref"
          fallback=none

          lookup_ref() {
            local requested_ref="$1"
            local wanted_ref="refs/heads/${requested_ref}"
            local attempt output revision status
            for attempt in 1 2 3; do
              if output=$(git ls-remote --exit-code --heads "$remote" "$wanted_ref" 2>&1); then
                revision=$(printf '%s\n' "$output" | awk -v wanted="$wanted_ref" '$2 == wanted {print $1}')
                if [ -n "$revision" ]; then
                  printf '%s\n' "$revision"
                  return 0
                fi
                return 2
              else
                status=$?
                if [ "$status" -eq 2 ]; then
                  return 2
                fi
                printf 'Workspace ref lookup attempt %s failed for %s: %s\n' "$attempt" "$wanted_ref" "$output" >&2
                if [ "$attempt" -lt 3 ]; then
                  sleep 1
                fi
              fi
            done
            return 1
          }

          if [ "$EVENT_NAME" = pull_request ]; then
            if [ -z "$PR_HEAD_REF" ]; then
              echo 'GITHUB_HEAD_REF is empty for a pull request.' >&2
              exit 1
            fi
            if revision_sha=$(lookup_ref "$PR_HEAD_REF"); then
              selected_ref="$PR_HEAD_REF"
            else
              lookup_status=$?
              if [ "$lookup_status" -ne 2 ]; then
                echo "Workspace PR ref lookup exhausted retries for $PR_HEAD_REF." >&2
                exit 1
              fi
              fallback="main (PR ref $PR_HEAD_REF not found)"
              selected_ref="$default_ref"
              if ! revision_sha=$(lookup_ref "$selected_ref"); then
                echo 'Workspace main ref lookup exhausted retries after confirmed PR-ref absence.' >&2
                exit 1
              fi
            fi
          else
            if ! revision_sha=$(lookup_ref "$selected_ref"); then
              echo 'Workspace default ref lookup exhausted retries.' >&2
              exit 1
            fi
          fi

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "selected_ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "revision_sha=$revision_sha" >> "$GITHUB_OUTPUT"

      - name: Check out Workspace peer revision
        shell: bash
        env:
          REVISION_SHA: ${{ steps.workspace_revision.outputs.revision_sha }}
          WORKSPACE_REPOSITORY: ${{ steps.workspace_revision.outputs.repository }}
          SELECTED_REF: ${{ steps.workspace_revision.outputs.selected_ref }}
          FALLBACK: ${{ steps.workspace_revision.outputs.fallback }}
        run: |
          set -euo pipefail
          workspace_path="${GITHUB_WORKSPACE}/workspace"
          remote="https://github.com/${WORKSPACE_REPOSITORY}.git"
          mkdir -p "$workspace_path"
          git -C "$workspace_path" init
          git -C "$workspace_path" remote add origin "$remote"

          checked_out=false
          for attempt in 1 2 3; do
            if git -C "$workspace_path" fetch --no-tags --depth=1 origin "$REVISION_SHA"; then
              if git -C "$workspace_path" checkout --detach "$REVISION_SHA"; then
                checked_out_sha=$(git -C "$workspace_path" rev-parse HEAD) || checked_out_sha=
                if [ "$checked_out_sha" = "$REVISION_SHA" ]; then
                  checked_out=true
                  break
                fi
                echo "Workspace checkout SHA mismatch on attempt ${attempt}: expected ${REVISION_SHA}, got ${checked_out_sha:-unavailable}." >&2
              else
                echo "Workspace checkout attempt ${attempt} failed for ${REVISION_SHA}." >&2
              fi
            else
              echo "Workspace fetch attempt ${attempt} failed for ${REVISION_SHA}." >&2
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 1
            fi
          done
          if [ "$checked_out" != true ]; then
            echo 'Workspace peer checkout exhausted retries.' >&2
            exit 1
          fi

          {
            echo "## Workspace peer checkout"
            echo "- Peer repository: ${WORKSPACE_REPOSITORY}"
            echo "- Selected ref: ${SELECTED_REF}"
            echo "- Fallback: ${FALLBACK}"
            echo "- Checked-out SHA: ${checked_out_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Workspace root for shared imports
        run: |
          echo "WORKSPACE_ROOT=${GITHUB_WORKSPACE}/workspace" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run advisory Ruff checks
        if: always()
        continue-on-error: true
        run: python tools/ruff_advisory.py

      - name: Install pinned mypy for advisory checks
        if: always()
        continue-on-error: true
        env:
          MYPY_ADVISORY_LOCAL_DIR: tmp/mypy-advisory-local/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          install_status=1
          if mkdir -p "$MYPY_ADVISORY_LOCAL_DIR"; then
            if python -m pip install --disable-pip-version-check --no-input mypy==1.18.2 \
                > "$MYPY_ADVISORY_LOCAL_DIR/mypy-install.stdout.txt" 2> "$MYPY_ADVISORY_LOCAL_DIR/mypy-install.stderr.txt"; then
              install_status=0
              echo "Pinned mypy installed."
            else
              install_status=$?
              echo "Pinned mypy install failed; the advisory report will record a tool error." >&2
            fi
          else
            echo "Mypy installation skipped; advisory output is unavailable." >&2
          fi
          if [[ -d "$MYPY_ADVISORY_LOCAL_DIR" ]]; then
            printf '%s\n' "$install_status" > "$MYPY_ADVISORY_LOCAL_DIR/mypy-install.exit-code" || echo "Could not persist mypy install status locally." >&2
          fi
          printf 'MYPY_INSTALL_EXIT_CODE=%s\n' "$install_status" >> "$GITHUB_ENV" || echo "Could not export mypy install status; CI remains advisory." >&2

      - name: Run advisory mypy checks
        if: always()
        continue-on-error: true
        env:
          MYPY_ADVISORY_LOCAL_DIR: tmp/mypy-advisory-local/${{ github.run_id }}-${{ github.run_attempt }}
          MYPY_ADVISORY_CI_DIR: tmp/mypy-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if mkdir -p "$MYPY_ADVISORY_LOCAL_DIR" "$MYPY_ADVISORY_CI_DIR"; then
            if python tools/mypy_ci_advisory.py \
              --config-path mypy.ini \
              --local-output-dir "$MYPY_ADVISORY_LOCAL_DIR" \
              --ci-output-dir "$MYPY_ADVISORY_CI_DIR" \
              > "$MYPY_ADVISORY_LOCAL_DIR/mypy-advisory-helper.stdout.txt" \
              2> "$MYPY_ADVISORY_LOCAL_DIR/mypy-advisory-helper.stderr.txt"; then
              :
            else
              echo "Advisory report generation failed; CI remains advisory." >&2
            fi
          else
            echo "Advisory output directories unavailable; CI remains advisory." >&2
          fi

      - name: Run bounded parallel and serial pytest lanes
        env:
          PLAYWRIGHT_ENABLED: "0"  # Set to "1" locally to run Playwright tests (FR-20260513-playwright-ui-gate)
        run: python tools/run_tests.py --parallel-junitxml tmp/pytest-parallel-junit.xml --serial-junitxml tmp/pytest-serial-junit.xml --manifest tmp/pytest-ci-manifest.json

      - name: Upload parallel JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-parallel
          path: tmp/pytest-parallel-junit.xml

      - name: Upload serial JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-serial
          path: tmp/pytest-serial-junit.xml

      - name: Upload advisory mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-advisory-music-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/mypy-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload CI test manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-manifest
          path: tmp/pytest-ci-manifest.json

      - name: Upload advisory Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-advisory-music-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/ruff-advisory-ci/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.111
      - name: Deploy to Fly.io (guitartrainer)
        run: flyctl deploy --remote-only --app guitartrainer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

