# Candidate app name only. Tyler approval is required before deployment.
app = 'ht'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile.hyperthreat-studio'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256