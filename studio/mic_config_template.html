<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperthreat Studios — Signal Tracking</title>
<style>
  :root {
    --border: #000;
    --row-stripe: #dcdcdc;
    --header-bg: #ebebeb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #000;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 7.35in;            /* letter 8.5in - 0.5in margins */
    margin: 0 auto;
    padding: 0;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .sheet:last-of-type { page-break-after: auto; }

  .sheet + .sheet { page-break-before: always; }

  header.brand {
    display: flex;
    align-items: center;
    gap: 0.18in;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 0.08in;
    margin-bottom: 0.12in;
  }

  header.brand .logo-wrap {
    width: 0.72in;
    height: 0.72in;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header.brand .logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  header.brand .title-block { flex: 1; }
  header.brand h1 {
    font-size: 18pt;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header.brand .subtitle {
    font-size: 9.5pt;
    margin-top: 1px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #222;
  }
  header.brand .instructions {
    font-size: 8.5pt;
    margin-top: 0.08in;
    color: #444;
    max-width: 26rem;
    line-height: 1.3;
  }
  .print-button {
    margin-left: auto;
    padding: 0.18em 0.45em;
    border: 1px solid #333;
    background: #fff;
    color: #111;
    font-size: 9pt;
    font-weight: 700;
    border-radius: 0.2rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .print-button:hover {
    background: #f3f3f3;
  }

  /* swap logos for screen vs print */
  .print-only { display: none; }
  .screen-only { display: block; }

  table.mic-grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.mic-grid th,
  table.mic-grid td {
    border: 1px solid var(--border);
    padding: 0;
    vertical-align: middle;
  }
  table.mic-grid thead th {
    background: var(--header-bg);
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    height: 0.28in;
    text-align: center;
    border-bottom: 2px solid var(--border);
    padding: 0.05in 0.04in;
  }
  table.mic-grid col.col-mic        { width: 12%; }
  table.mic-grid col.col-instrument { width: 24%; }
  table.mic-grid col.col-wall       { width: 22%; }
  table.mic-grid col.col-stud       { width: 42%; }

  table.mic-grid td {
    height: 0.30in;
    font-size: 11pt;
    padding: 0 0.08in;
  }
  table.mic-grid td.mic-num {
    text-align: right;
    font-weight: 700;
    padding-right: 0.12in;
    background: #fafafa;
  }
  .editable-cell {
    outline: none;
    min-width: 100%;
    cursor: text;
    padding: 0 0.08in;
  }
  .editable-cell:focus {
    outline: 1px dashed #666;
    background: rgba(0, 0, 0, 0.03);
  }
  .editable-cell:empty:before {
    content: attr(data-placeholder);
    color: #999;
    font-style: italic;
  }
  table.mic-grid tbody tr:nth-child(even) td:not(.mic-num) {
    background: var(--row-stripe);
  }

  .legend {
    margin-top: 0.2in;
    padding: 0.14in;
    border: 1px solid var(--border);
    background: #f7f7f7;
  }
  .legend h2 {
    margin: 0 0 0.1in;
    font-size: 11pt;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .legend-groups {
    display: grid;
    gap: 0.12in;
    grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
  }
  .legend-group {
    padding: 0.12in;
    border: 1px solid #bbb;
    border-radius: 0.14rem;
    background: #fff;
  }
  .legend-group-title {
    font-size: 9.5pt;
    font-weight: 700;
    margin-bottom: 0.08in;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #222;
  }
  .legend-group-items {
    display: grid;
    grid-template-columns: repeat(2, minmax(3.75rem, 1fr));
    gap: 0.06in;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.2em;
    padding: 0.08em 0.12em;
    border: 1px solid #ccc;
    color: #111;
    font-size: 10pt;
    font-weight: 700;
    cursor: grab;
    user-select: none;
  }
  .legend-item:active {
    cursor: grabbing;
  }
  .preamp-cell {
    min-width: 3rem;
    cursor: pointer;
  }
  .preamp-cell.drop-target {
    outline: 2px dashed #666;
    background: rgba(0, 0, 0, 0.02);
  }
  .legend-group-api .legend-item {
    background: rgba(198, 221, 255, 0.55);
    border-color: #a7c2ff;
  }
  .legend-group-neve .legend-item {
    background: rgba(255, 220, 220, 0.55);
    border-color: #ffb2b2;
  }
  .legend-group-ssl .legend-item {
    background: rgba(219, 255, 218, 0.55);
    border-color: #a9d7a8;
  }
  .legend-group-warm .legend-item {
    background: rgba(255, 252, 220, 0.7);
    border-color: #e7d785;
  }
  .legend-group-vintech .legend-item {
    background: rgba(224, 224, 255, 0.55);
    border-color: #b9b3ff;
  }
  @media print {
    .legend { background: #f5f5f5; }
    .legend-group { background: #fff; border-color: #888; }
    .legend-group-api .legend-item { background: #e6e6e6; }
    .legend-group-neve .legend-item { background: #dddddd; }
    .legend-group-ssl .legend-item { background: #d4d4d4; }
    .legend-group-warm .legend-item { background: #cbcbcb; }
    .legend-group-vintech .legend-item { background: #c2c2c2; }
    .editable-cell:empty:before {
      content: none !important;
    }
    .instructions,
    .print-button {
      display: none !important;
    }
  }

  footer.foot {
    margin-top: 0.10in;
    font-size: 8pt;
    color: #555;
    text-align: right;
    letter-spacing: 0.04em;
  }

  @page {
    size: letter;
    margin: 0.5in;
  }

  @media print {
    .screen-only { display: none !important; }
    .print-only  { display: block !important; }
    body { background: #fff; }
    .sheet { width: auto; margin: 0; }
    table.mic-grid tbody tr:nth-child(even) td:not(.mic-num) {
      background: #ececec;
    }
  }
</style>
</head>

<div id="sheets"></div>

<script>
  const CHANNEL_COUNT = 16;
  const SHEET_COUNT = 2; // front + back, identical for duplex

  function buildSheet() {
    const tpl = document.getElementById('sheet-template');
    const node = tpl.content.cloneNode(true);
    const tbody = node.querySelector('.grid-body');
    for (let i = 1; i <= CHANNEL_COUNT; i++) {
      const tr = document.createElement('tr');
      const tdNum = document.createElement('td');
      tdNum.className = 'mic-num';
      tdNum.textContent = i;
      const tdInstrument = document.createElement('td');
      tdInstrument.className = 'editable-cell';
      tdInstrument.contentEditable = 'true';
      tdInstrument.dataset.placeholder = 'Instrument';
      const tdWall = document.createElement('td');
      tdWall.className = 'editable-cell';
      tdWall.contentEditable = 'true';
      tdWall.dataset.placeholder = 'Wall Mount #';
      const tdPreamp = document.createElement('td');
      tdPreamp.className = 'preamp-cell';
      tdPreamp.dataset.dropTarget = 'true';
      tr.appendChild(tdNum);
      tr.appendChild(tdInstrument);
      tr.appendChild(tdWall);
      tr.appendChild(tdPreamp);
      tbody.appendChild(tr);
    }
    return node;
  }

  function setupDragAndDrop(container) {
    const legendItems = container.querySelectorAll('.legend-item');
    const dropCells = container.querySelectorAll('.preamp-cell');

    legendItems.forEach((item) => {
      item.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('text/plain', item.textContent);
        event.dataTransfer.effectAllowed = 'copy';
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
      });
    });

    dropCells.forEach((cell) => {
      cell.addEventListener('dragover', (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragenter', (event) => {
        event.preventDefault();
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('drop', (event) => {
        event.preventDefault();
        const value = event.dataTransfer.getData('text/plain');
        if (value) {
          cell.textContent = value;
        }
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('dblclick', () => {
        cell.textContent = '';
      });
    });
  }

  const host = document.getElementById('sheets');
  for (let s = 0; s < SHEET_COUNT; s++) {
    host.appendChild(buildSheet());
  }
  setupDragAndDrop(document);

  // Logo inlined; loader removed.
</script>
