<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Hyperthreat Studios — Signal Tracking</title>
<style>
  :root {
    --border: #000;
    --row-stripe: #dcdcdc;
    --header-bg: #ebebeb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #000;
    background: #fff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 7.35in;            /* letter 8.5in - 0.5in margins */
    margin: 0 auto;
    padding: 0;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .sheet:last-of-type { page-break-after: auto; }

  .sheet + .sheet { page-break-before: always; }

  header.brand {
    display: flex;
    align-items: center;
    gap: 0.18in;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 0.08in;
    margin-bottom: 0.12in;
  }

  header.brand .logo-wrap {
    width: 0.72in;
    height: 0.72in;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header.brand .logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  header.brand .title-block { flex: 1; }
  header.brand h1 {
    font-size: 18pt;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header.brand .subtitle {
    font-size: 9.5pt;
    margin-top: 1px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #222;
  }
  header.brand .instructions {
    font-size: 8.5pt;
    margin-top: 0.08in;
    color: #444;
    max-width: 26rem;
    line-height: 1.3;
  }
  .print-button {
    margin-left: auto;
    padding: 0.18em 0.45em;
    border: 1px solid #333;
    background: #fff;
    color: #111;
    font-size: 9pt;
    font-weight: 700;
    border-radius: 0.2rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .print-button:hover {
    background: #f3f3f3;
  }

  /* swap logos for screen vs print */
  .print-only { display: none; }
  .screen-only { display: block; }

  table.mic-grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.mic-grid th,
  table.mic-grid td {
    border: 1px solid var(--border);
    padding: 0;
    vertical-align: middle;
  }
  table.mic-grid thead th {
    background: var(--header-bg);
    font-size: 10pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    height: 0.28in;
    text-align: center;
    border-bottom: 2px solid var(--border);
    padding: 0.05in 0.04in;
  }
  table.mic-grid col.col-mic        { width: 12%; }
  table.mic-grid col.col-instrument { width: 24%; }
  table.mic-grid col.col-wall       { width: 22%; }
  table.mic-grid col.col-stud       { width: 42%; }

  table.mic-grid td {
    height: 0.30in;
    font-size: 11pt;
    padding: 0 0.08in;
  }
  table.mic-grid td.mic-num {
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    padding: 0.06in 0.08in;
    background: #fafafa;
  }
  .editable-cell {
    outline: none;
    min-width: 100%;
    cursor: text;
    padding: 0 0.08in;
  }
  .editable-cell:focus {
    outline: 1px dashed #666;
    background: rgba(0, 0, 0, 0.03);
  }
  .editable-cell:empty:before {
    content: attr(data-placeholder);
    color: #999;
    font-style: italic;
  }
  table.mic-grid tbody tr:nth-child(even) td:not(.mic-num) {
    background: var(--row-stripe);
  }

  .legend {
    margin-top: 0.2in;
    padding: 0.14in;
    border: 1px solid var(--border);
    background: #f7f7f7;
  }
  .legend h2 {
    margin: 0 0 0.1in;
    font-size: 11pt;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .legend-groups {
    display: grid;
    gap: 0.12in;
    grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
  }
  .legend-group {
    padding: 0.12in;
    border: 1px solid #bbb;
    border-radius: 0.14rem;
    background: #fff;
  }
  .legend-group-title {
    font-size: 9.5pt;
    font-weight: 700;
    margin-bottom: 0.08in;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #222;
  }
  .legend-group-items {
    display: grid;
    grid-template-columns: repeat(2, minmax(3.75rem, 1fr));
    gap: 0.06in;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 1.2em;
    padding: 0.08em 0.12em;
    border: 1px solid #ccc;
    color: #111;
    font-size: 10pt;
    font-weight: 700;
    cursor: grab;
    user-select: none;
  }
  .legend-item:active {
    cursor: grabbing;
  }
  .preamp-cell {
    min-width: 3rem;
    cursor: pointer;
  }
  .preamp-cell.drop-target {
    outline: 2px dashed #666;
    background: rgba(0, 0, 0, 0.02);
  }
  .legend-group-api .legend-item {
    background: rgba(198, 221, 255, 0.55);
    border-color: #a7c2ff;
  }
  .legend-group-neve .legend-item {
    background: rgba(255, 220, 220, 0.55);
    border-color: #ffb2b2;
  }
  .legend-group-ssl .legend-item {
    background: rgba(219, 255, 218, 0.55);
    border-color: #a9d7a8;
  }
  .legend-group-warm .legend-item {
    background: rgba(255, 252, 220, 0.7);
    border-color: #e7d785;
  }
  .legend-group-vintech .legend-item {
    background: rgba(224, 224, 255, 0.55);
    border-color: #b9b3ff;
  }
  .grid-and-legends {
    display: flex;
    gap: 0.12in;
    align-items: flex-start;
  }
  .table-wrap { flex: 1 1 auto; }
  .instruments-legend-slot,
  .preamp-legend { width: 4.4rem; flex: 0 0 4.4rem; position: sticky; top: 0.95in; align-self: flex-start; z-index: 50; }
  /* make preamp aside visually minimal (no outer legend box) and nudge it down a bit */
  .preamp-legend { padding: 0 0.06in; background: transparent; border: none; margin-top: 0; }
  .preamp-legend .legend-group { padding: 0.08in; border: 1px solid #ddd; background: #fff; border-radius: 0.12rem; }
  .global-wrap { display: flex; gap: 0.12in; justify-content: center; align-items: flex-start; }
  .sheets-wrap { flex: 0 0 auto; width: 7.35in; display: flex; flex-direction: column; gap: 0.8in; align-items: center; }
  .sheets-wrap .sheet { margin: 0; }
  /* instruments legend styling: smaller, colored like preamp items */
  /* compact instruments legend (MVP): minimal containers, just small draggable items */
  /* instruments column: narrower and compact; groups arranged vertically */
  .instruments-legend-slot {
    width: 4.4rem;
    flex: 0 0 4.4rem;
    padding: 0.02in 0.04in;
    display: flex;
    flex-direction: column;
    gap: 0.04in;
    align-items: stretch;
    margin-top: 0; /* use sticky top for vertical alignment */
    z-index: 60;
    position: sticky;
    top: 0.95in;
    transform: translateX(-75px); /* nudge left by ~75px (additional 45px) */
  }
  .instruments-legend-slot .legend-groups { grid-template-columns: 1fr; gap: 0.06in; }
  .instruments-legend-slot .legend-group { padding: 0.06in; }
  .instruments-legend-slot .legend-group-title { font-size: 8.5pt; margin-bottom: 0.06in; }
  .instruments-legend-slot .legend-item {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 9pt;
    padding: 0.06em 0.08em;
    min-height: 1em;
    border-radius: 0.12rem;
    box-shadow: none;
  }
  /* add a little left padding to the sheets area so legend items don't visually clash */
  .sheets-wrap { flex: 0 0 auto; width: 7.35in; display: flex; flex-direction: column; gap: 0.8in; align-items: center; padding-left: 1.0in; padding-right: 1.0in; }
  @media print {
    .legend { background: #f5f5f5; }
    /* hide all legend sidebars/containers in print */
    .legend, .instruments-legend, .instruments-legend-slot, .preamp-legend { display: none !important; }
    .legend-group { background: #fff; border-color: #888; }
    .legend-group-api .legend-item { background: #e6e6e6; }
    .legend-group-neve .legend-item { background: #dddddd; }
    .legend-group-ssl .legend-item { background: #d4d4d4; }
    .legend-group-warm .legend-item { background: #cbcbcb; }
    .legend-group-vintech .legend-item { background: #c2c2c2; }
    .editable-cell:empty:before {
      content: none !important;
    }
    .instructions,
    .print-button {
      display: none !important;
    }
  }

  footer.foot {
    margin-top: 0.10in;
    font-size: 8pt;
    color: #555;
    text-align: right;
    letter-spacing: 0.04em;
  }

  @page {
    size: letter;
    margin: 0.5in;
  }

  @media print {
    .screen-only { display: none !important; }
    .print-only  { display: block !important; }
    body { background: #fff; }
    /* make the sheet expand to fill printable area */
    .sheet { width: auto; margin: 0; padding: 0.25in 0.25in 0.5in 0.25in; }
    .sheets-wrap { padding-left: 0 !important; padding-right: 0 !important; width: 100% !important; }
    table.mic-grid { width: 100% !important; }
    table.mic-grid tbody tr:nth-child(even) td:not(.mic-num) {
      background: #ececec;
    }
  }
  .cable-badge {
    display: inline-block;
    padding: 0.12em 0.35em;
    background: #e6f0ff;
    border: 1px solid #8fb0ff;
    border-radius: 0.25rem;
    font-weight: 700;
    font-size: 9pt;
    color: #0b3a8a;
  }
  .legend-badge {
    display: inline-block;
    padding: 0.12em 0.28em;
    background: #f3f3f3;
    border: 1px solid #ccc;
    border-radius: 0.25rem;
    font-weight: 700;
    font-size: 9pt;
    color: #111;
  }
  .legend-badge.instrument { min-width: 3.0rem; text-align: center; }
  .legend-badge.preamp { min-width: 3.2rem; text-align: center; }
  #save-status {
    position: fixed; bottom: 12px; right: 14px; z-index: 9999;
    padding: 0.3em 0.7em; border-radius: 999px;
    font-size: 9.5pt; font-weight: 700;
    background: #fff; border: 1px solid #bbb;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); color: #555;
    pointer-events: none;
  }
  #save-status.ok { color: #1a7f4b; }
  #save-status.pending { color: #9a7d00; }
  #save-status.error { color: #b3261e; }
  #autosave-bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 10000; display: flex; align-items: center; gap: 0.7rem;
    padding: 0.6rem 0.9rem; border-radius: 12px;
    background: #fff; border: 1px solid #2f6df0;
    box-shadow: 0 10px 26px rgba(0,0,0,0.22); color: #111; font-size: 10.5pt;
    max-width: min(92vw, 30rem);
  }
  #autosave-bar button {
    flex: 0 0 auto; padding: 0.45rem 0.85rem; border-radius: 999px;
    border: none; background: #2f6df0; color: #fff; font-weight: 800; cursor: pointer; font-size: 10pt;
  }
  #autosave-bar button:hover { filter: brightness(1.05); }
  @media print { #save-status, #autosave-bar { display: none !important; } }
</style>
</head>

<script>
  const CHANNEL_COUNT = 16;
  const SHEET_COUNT = 2; // front + back, identical for duplex

  // Compute the next numbered label for a base instrument name (e.g., "guitar" -> "guitar 3")
  function nextLabelFor(base) {
    const rows = Array.from(document.querySelectorAll('.grid-body tr'));
    const esc = base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('^' + esc + '(?:\\s*(\\d+))?$', 'i');
    let max = 0;
    rows.forEach(r => {
      const instrCell = r.querySelector('.editable-cell[data-col="instrument"]');
      if (!instrCell) return;
      const txt = instrCell.textContent.trim();
      const m = txt.match(re);
      if (m) {
        if (m[1]) {
          const n = parseInt(m[1], 10);
          if (!isNaN(n) && n > max) max = n;
        } else if (txt.length > 0) {
          max = Math.max(max, 1);
        }
      }
    });
    return base + ' ' + (max + 1);
  }

  // Cable color mapping (16 visually distinct hues)
  function cableColorFor(n) {
    const idx = ((n - 1) % 16 + 16) % 16; // 0-based
    const hue = Math.round((idx / 16) * 360);
    const bg = `hsl(${hue} 85% 88%)`;
    const border = `hsl(${hue} 75% 60%)`;
    const text = '#111';
    return { bg, border, text };
  }

  function createCableBadge(n) {
    const span = document.createElement('span');
    span.className = 'cable-badge';
    span.textContent = String(n);
    span.dataset.cable = String(n);
    const c = cableColorFor(Number(n));
    const bg = (arguments[1] && arguments[1].bg) ? arguments[1].bg : c.bg;
    const border = (arguments[1] && arguments[1].border) ? arguments[1].border : c.border;
    const textColor = (arguments[1] && arguments[1].color) ? arguments[1].color : c.text;
    span.style.backgroundColor = bg;
    span.style.borderColor = border;
    span.style.color = textColor;
    span.dataset.bg = bg;
    span.dataset.border = border;
    span.dataset.color = textColor;
    span.draggable = true;
    span.addEventListener('dragstart', (ev) => {
      try { ev.dataTransfer.setData('text/plain', String(n)); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-type', 'cable'); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-bg', span.style.backgroundColor); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-border', span.style.borderColor); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-color', span.style.color); } catch (e) {}
      ev.dataTransfer.effectAllowed = 'copy';
      span.classList.add('dragging');
    });
    span.addEventListener('dragend', () => span.classList.remove('dragging'));
    return span;
  }

  function cableNumbersFromText(value) {
    const text = (value || '').trim();
    if (!text || !/^\d+(?:(?:\s*[,;]\s*)|\s+)\d+(?:\s*[,;]\s*|\s+\d+)*$/.test(text)) {
      return text && /^\d+$/.test(text) ? [parseInt(text, 10)] : null;
    }
    return text.split(/\s*[,;]\s*|\s+/).filter(Boolean).map((n) => parseInt(n, 10));
  }

  function renderCableCell(cell, value) {
    const text = (value || '').toString().trim();
    const numbers = cableNumbersFromText(text);
    cell.innerHTML = '';
    if (numbers) {
      numbers.forEach((n) => cell.appendChild(createCableBadge(n)));
    } else if (text) {
      cell.textContent = text;
    }
  }

  function selectCellContents(cell) {
    const selection = window.getSelection();
    if (!selection) return;
    const range = document.createRange();
    range.selectNodeContents(cell);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function normalizeWallCell(cell) {
    if (!cell) return;
    const text = (cell.textContent || '').trim();
    const nums = cableNumbersFromText(text);
    const hasBadges = cell.querySelector && cell.querySelector('.cable-badge');
    if (hasBadges) return; // already badges
    if (nums) renderCableCell(cell, text);
  }

  function normalizeAllWallCells() {
    const wallCells = document.querySelectorAll('.editable-cell[data-col="wall"]');
    wallCells.forEach(c => normalizeWallCell(c));
  }

  // legend badges for instruments/preamps
  function pickColorForLabel(label) {
    const l = (label || '').toLowerCase();
    // explicit palette overrides requested by user
    if (l.includes('vox') || l.includes('vocal')) {
      // pink
      return { bg: `hsl(330 70% 92%)`, border: `hsl(330 60% 70%)`, text: '#111' };
    }
    if (l.includes('guitar')) {
      // green
      return { bg: `hsl(140 60% 92%)`, border: `hsl(140 55% 65%)`, text: '#081d08' };
    }
    if (l.includes('bass')) {
      // orange
      return { bg: `hsl(24 85% 92%)`, border: `hsl(24 75% 60%)`, text: '#2b1600' };
    }
    // drums / toms / overheads -> yellow
    if (/(kick|snare|tom|overhead|drum)/i.test(l)) {
      return { bg: `hsl(52 90% 92%)`, border: `hsl(52 80% 60%)`, text: '#2b2600' };
    }
    // piano / keys -> purple
    if (/(piano|key|keys)/i.test(l)) {
      return { bg: `hsl(270 65% 92%)`, border: `hsl(270 60% 68%)`, text: '#1a0730' };
    }
    // deterministic hash to hue for everything else
    let h = 0;
    for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    const hue = Math.round((h % 360));
    return { bg: `hsl(${hue} 70% 92%)`, border: `hsl(${hue} 60% 70%)`, text: '#111' };
  }

  function createLegendBadge(text, kind, styleOverride) {
    const span = document.createElement('span');
    span.className = 'legend-badge ' + (kind || 'instrument');
    span.textContent = text;
    span.dataset.kind = kind || 'instrument';
    const c = pickColorForLabel(text.toLowerCase());
    // apply computed or override styles
    const bg = (styleOverride && styleOverride.bg) ? styleOverride.bg : c.bg;
    const border = (styleOverride && styleOverride.border) ? styleOverride.border : c.border;
    const color = (styleOverride && styleOverride.color) ? styleOverride.color : c.text;
    span.style.backgroundColor = bg;
    span.style.borderColor = border;
    span.style.color = color;
    span.dataset.bg = bg;
    span.dataset.border = border;
    span.dataset.color = color;
    span.draggable = true;
    span.addEventListener('dragstart', (ev) => {
      try { ev.dataTransfer.setData('text/plain', text); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-type', kind || 'instrument'); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-bg', span.style.backgroundColor); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-border', span.style.borderColor); } catch (e) {}
      try { ev.dataTransfer.setData('text/x-item-color', span.style.color); } catch (e) {}
      ev.dataTransfer.effectAllowed = 'copy';
      span.classList.add('dragging');
    });
    span.addEventListener('dragend', () => span.classList.remove('dragging'));
    return span;
  }

  function buildSheet() {
    const tpl = document.getElementById('sheet-template');
    const node = tpl.content.cloneNode(true);
    const tbody = node.querySelector('.grid-body');
    for (let i = 1; i <= CHANNEL_COUNT; i++) {
      const tr = document.createElement('tr');
      const tdNum = document.createElement('td');
      tdNum.className = 'mic-num';
      // render the cable number as a colored draggable badge
      tdNum.appendChild(createCableBadge(i));
      const tdInstrument = document.createElement('td');
      tdInstrument.className = 'editable-cell';
      tdInstrument.dataset.col = 'instrument';
      tdInstrument.contentEditable = 'true';
      tdInstrument.dataset.placeholder = 'Instrument';
      const tdWall = document.createElement('td');
      tdWall.className = 'editable-cell';
      tdWall.dataset.col = 'wall';
      tdWall.contentEditable = 'true';
      tdWall.dataset.placeholder = 'Wall Mount #';
      tdWall.appendChild(createCableBadge(i));
      const tdPreamp = document.createElement('td');
      tdPreamp.className = 'preamp-cell';
      tdPreamp.dataset.col = 'preamp';
      tdPreamp.dataset.dropTarget = 'true';
      tr.appendChild(tdNum);
      tr.appendChild(tdInstrument);
      tr.appendChild(tdWall);
      tr.appendChild(tdPreamp);
      tbody.appendChild(tr);
    }
    return node;
  }

  function setupDragAndDrop(container) {
    const legendItems = container.querySelectorAll('.legend-item');
    const dropCells = container.querySelectorAll('.preamp-cell');
    const instrDropCells = container.querySelectorAll('.editable-cell[data-col="instrument"]');
    const numCells = container.querySelectorAll('.mic-num');
    const wallCells = container.querySelectorAll('.editable-cell[data-col="wall"]');

    legendItems.forEach((item) => {
      item.addEventListener('dragstart', (event) => {
        const text = item.textContent.trim();
        const type = item.dataset.type || 'preamp';
        try { event.dataTransfer.setData('text/plain', text); } catch (e) {}
        try { event.dataTransfer.setData('text/x-item-type', type); } catch (e) {}
        try {
          const computed = pickColorForLabel(text.toLowerCase());
          const cs = window.getComputedStyle ? window.getComputedStyle(item) : null;
          const bg = (cs && cs.backgroundColor) ? cs.backgroundColor : (item.style.backgroundColor || computed.bg);
          const border = (cs && cs.borderColor) ? cs.borderColor : (item.style.borderColor || computed.border);
          const color = (cs && cs.color) ? cs.color : (item.style.color || computed.text);
          event.dataTransfer.setData('text/x-item-bg', bg);
          event.dataTransfer.setData('text/x-item-border', border);
          event.dataTransfer.setData('text/x-item-color', color);
        } catch (e) {}
        event.dataTransfer.effectAllowed = 'copy';
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
      });
    });

    // cable badges inside .mic-num cells are already draggable via createCableBadge()
    numCells.forEach((cell) => {
      cell.contentEditable = 'true';
      cell.addEventListener('focus', () => selectCellContents(cell));
      cell.addEventListener('dblclick', () => { cell.textContent = ''; saveGridState(); });
      cell.addEventListener('blur', () => {
        renderCableCell(cell, cell.textContent);
        saveGridState();
      });
      cell.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); cell.blur(); }
      });
    });

    dropCells.forEach((cell) => {
      cell.addEventListener('dragover', (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragenter', (event) => {
        event.preventDefault();
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('drop', (event) => {
        event.preventDefault();
        const valueRaw = event.dataTransfer.getData('text/plain') || '';
        const value = valueRaw.trim();
        const itemType = (() => { try { return event.dataTransfer.getData('text/x-item-type'); } catch (e) { return ''; } })() || '';
        // accept preamp by explicit type, or fallback when payload contains letters
        const fallbackAccept = (!itemType && /[A-Za-z]/.test(value));
        if (itemType !== 'preamp' && !fallbackAccept) { cell.classList.remove('drop-target'); return; }
        if (value) {
          // render as a draggable legend-style badge
          // preserve color info from drag if present
          const styleOverride = {};
          try { styleOverride.bg = event.dataTransfer.getData('text/x-item-bg'); } catch (e) {}
          try { styleOverride.border = event.dataTransfer.getData('text/x-item-border'); } catch (e) {}
          try { styleOverride.color = event.dataTransfer.getData('text/x-item-color'); } catch (e) {}
          const badge = createLegendBadge(value, 'preamp', (styleOverride.bg || styleOverride.border || styleOverride.color) ? styleOverride : null);
          cell.innerHTML = '';
          cell.appendChild(badge);
        }
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('dblclick', () => {
        cell.textContent = '';
      });
    });

    // instrument drop targets
    instrDropCells.forEach((cell) => {
      cell.addEventListener('dragover', (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragenter', (event) => {
        event.preventDefault();
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('drop', (event) => {
        event.preventDefault();
        const raw = (event.dataTransfer && event.dataTransfer.getData) ? event.dataTransfer.getData('text/plain') : '';
        const value = (raw || '').trim();
        const itemType = (() => { try { return event.dataTransfer.getData('text/x-item-type'); } catch (e) { return ''; } })() || '';
        // allow instrument drops by explicit type, or fallback when payload is non-numeric text
        const fallbackAccept = (!itemType && value && !/^\d+$/.test(value));
        if (itemType !== 'instrument' && !fallbackAccept) { cell.classList.remove('drop-target'); return; }
        if (value) {
          // If dropped value already ends with a number, use as-is; otherwise auto-number
          const endsWithNumber = /\s\d+$/i.test(value);
          const label = endsWithNumber ? value : nextLabelFor(value);
          const styleOverride = {};
          try { styleOverride.bg = event.dataTransfer.getData('text/x-item-bg'); } catch (e) {}
          try { styleOverride.border = event.dataTransfer.getData('text/x-item-border'); } catch (e) {}
          try { styleOverride.color = event.dataTransfer.getData('text/x-item-color'); } catch (e) {}
          const badge = createLegendBadge(label, 'instrument', (styleOverride.bg || styleOverride.border || styleOverride.color) ? styleOverride : null);
          cell.innerHTML = '';
          cell.appendChild(badge);
        }
        cell.classList.remove('drop-target');
      });
      // allow double-click to clear instrument cell
      cell.addEventListener('dblclick', () => { cell.textContent = ''; });
    });

    // Wall mount cells: accept cable drops and allow clearing
    wallCells.forEach((cell) => {
      cell.addEventListener('dragover', (event) => {
        event.preventDefault();
        try { event.dataTransfer.dropEffect = 'copy'; } catch (e) {}
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragenter', (event) => {
        event.preventDefault();
        cell.classList.add('drop-target');
      });
      cell.addEventListener('dragleave', () => {
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('drop', (event) => {
        event.preventDefault();
        const itemType = (() => { try { return event.dataTransfer.getData('text/x-item-type'); } catch (e) { return ''; } })();
        // accept only cable drops here (or numeric payloads as fallback)
        const raw = (event.dataTransfer && event.dataTransfer.getData) ? event.dataTransfer.getData('text/plain') : '';
        const value = (raw || '').trim();
        if (itemType !== 'cable' && !/^\d+$/.test(value)) { cell.classList.remove('drop-target'); return; }
        if (value) {
          if (/^\d+$/.test(value)) {
            const n = parseInt(value, 10);
            const styleOverride = {};
            try { styleOverride.bg = event.dataTransfer.getData('text/x-item-bg'); } catch (e) {}
            try { styleOverride.border = event.dataTransfer.getData('text/x-item-border'); } catch (e) {}
            try { styleOverride.color = event.dataTransfer.getData('text/x-item-color'); } catch (e) {}
            const badge = createCableBadge(n, (styleOverride.bg||styleOverride.border||styleOverride.color) ? styleOverride : null);
            cell.innerHTML = '';
            cell.appendChild(badge);
          } else {
            cell.textContent = value;
          }
        }
        cell.classList.remove('drop-target');
      });
      cell.addEventListener('dblclick', () => { cell.textContent = ''; });
      cell.addEventListener('focus', () => selectCellContents(cell));
      // when user types a number and blurs, convert to badge(s)
      cell.addEventListener('blur', () => {
        renderCableCell(cell, cell.textContent);
        saveGridState();
      });
      cell.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') { ev.preventDefault(); cell.blur(); }
      });
    });
  }

  // --- Self-contained persistence -----------------------------------------
  // localStorage on file:// is unreliable once the file is moved to another
  // drive or reopened days later. "Save to File" bakes the current grid state
  // into this HTML document (the #embedded-state block) and downloads it, so
  // the data travels inside the file itself — no external JSON or database.
  const ORIGINAL_PREAMP_LEGEND_HTML = (document.getElementById('preamp-legend') || {}).innerHTML || '';

  function readEmbeddedState() {
    const el = document.getElementById('embedded-state');
    if (!el) return null;
    try {
      const parsed = JSON.parse(el.textContent || 'null');
      return (parsed && typeof parsed === 'object') ? parsed : null;
    } catch (e) { return null; }
  }

  function hydrateFromEmbeddedState() {
    // Use the baked-in state only when localStorage is empty (e.g. after a
    // browser wipe or when the file was moved to a new path).
    const state = readEmbeddedState();
    if (!state) return;
    if (!localStorage.getItem('micConfigSheets') && state.micConfigSheets) {
      localStorage.setItem('micConfigSheets', JSON.stringify(state.micConfigSheets));
    }
  }

  function buildSelfContainedHTML() {
    suppressSchedule = true;
    try {
      saveGridState();
      let sheetsState = null;
      try { sheetsState = JSON.parse(localStorage.getItem('micConfigSheets') || 'null'); } catch (e) {}
      const state = { micConfigSheets: sheetsState, savedAt: new Date().toISOString() };
      const clone = document.documentElement.cloneNode(true);
      const embedded = clone.querySelector('#embedded-state');
      if (embedded) embedded.textContent = JSON.stringify(state);
      // Reset runtime-generated regions so the saved file rebuilds cleanly on open.
      const sheetsEl = clone.querySelector('#sheets');
      if (sheetsEl) sheetsEl.innerHTML = '';
      const instrEl = clone.querySelector('#instruments-legend');
      if (instrEl) instrEl.innerHTML = '';
      const preampEl = clone.querySelector('#preamp-legend');
      if (preampEl) preampEl.innerHTML = ORIGINAL_PREAMP_LEGEND_HTML;
      clone.querySelectorAll('[data-runtime-ui]').forEach((n) => n.remove());
      return '<!DOCTYPE html>\n' + clone.outerHTML;
    } finally {
      suppressSchedule = false;
    }
  }

  function saveStateToFile() {
    const html = buildSelfContainedHTML();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mic_config_template.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ===== AutoSave to the actual file ====================================
  // A double-clicked file:// page cannot silently write to its own file, so
  // automatic saving uses the File System Access API (Chrome/Edge) after a
  // one-time file pick, remembered per file location so the repo copy and an
  // external-drive copy each keep their own state. Browsers without that API
  // (Firefox/Safari/in-editor previews) get a one-click manual save. The file
  // also carries its own state in #embedded-state, and localStorage keeps the
  // working copy between reopens of the same file.
  const SELF_FILENAME = 'mic_config_template.html';
  const FS_API = typeof window.showSaveFilePicker === 'function';
  // Per-location key so each copy of the file remembers its own handle.
  const HANDLE_KEY = 'handle:' + decodeURIComponent(location.pathname);
  let fileHandle = null;
  let autoSaveTimer = null;
  let lastSavedHtml = '';
  let dirtyToFile = false;
  let suppressSchedule = false;
  let autoSaveReady = false;
  let statusEl = null;
  let autoSaveBar = null;

  function idbOpen() {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open('studioAutoSave', 1); } catch (e) { resolve(null); return; }
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    if (!db) return null;
    return new Promise((resolve) => {
      const r = db.transaction('handles', 'readonly').objectStore('handles').get(key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  }
  async function idbSet(key, value) {
    const db = await idbOpen();
    if (!db) return;
    return new Promise((resolve) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  }

  function setStatus(text, kind) {
    if (!statusEl) {
      statusEl = document.createElement('div');
      statusEl.id = 'save-status';
      statusEl.setAttribute('data-runtime-ui', '');
      document.body.appendChild(statusEl);
    }
    statusEl.textContent = text;
    statusEl.className = kind || 'idle';
  }

  function hideAutoSaveBar() {
    if (autoSaveBar) { autoSaveBar.remove(); autoSaveBar = null; }
  }
  function showAutoSaveBar(message, label, onClick) {
    hideAutoSaveBar();
    autoSaveBar = document.createElement('div');
    autoSaveBar.id = 'autosave-bar';
    autoSaveBar.setAttribute('data-runtime-ui', '');
    const span = document.createElement('span');
    span.textContent = message;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    autoSaveBar.appendChild(span);
    autoSaveBar.appendChild(btn);
    document.body.appendChild(autoSaveBar);
  }

  async function writeViaHandle(html) {
    if (!fileHandle) return false;
    try {
      if (fileHandle.queryPermission) {
        const p = await fileHandle.queryPermission({ mode: 'readwrite' });
        if (p !== 'granted') return false;
      }
      const writable = await fileHandle.createWritable();
      await writable.write(html);
      await writable.close();
      return true;
    } catch (e) {
      return false;
    }
  }

  async function doAutoSave() {
    if (!fileHandle) return;
    let html;
    try { html = buildSelfContainedHTML(); } catch (e) { return; }
    if (html === lastSavedHtml) { dirtyToFile = false; return; }
    setStatus('Saving\u2026', 'pending');
    const ok = await writeViaHandle(html);
    if (ok) {
      lastSavedHtml = html;
      dirtyToFile = false;
      setStatus('Saved \u2713', 'ok');
    } else {
      dirtyToFile = true;
      setStatus('Save failed \u2014 click Save', 'error');
    }
  }

  function scheduleSave() {
    if (!autoSaveReady) return;
    dirtyToFile = true;
    if (suppressSchedule) return;
    if (!fileHandle) {
      if (!FS_API) setStatus('Unsaved \u2014 click Save', 'error');
      return;
    }
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(doAutoSave, 800);
  }

  async function turnOnFileAutoSave() {
    if (!FS_API) return;
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: SELF_FILENAME,
        types: [{ description: 'HTML page', accept: { 'text/html': ['.html'] } }]
      });
      await idbSet(HANDLE_KEY, fileHandle);
      hideAutoSaveBar();
      lastSavedHtml = '';
      await doAutoSave();
    } catch (e) {
      // operator cancelled the picker; the safety net stays in place
    }
  }

  function manualSaveNow() {
    saveStateToFile();
    dirtyToFile = false;
    setStatus('Saved a copy \u2713', 'ok');
  }

  async function initAutoSave() {
    try { lastSavedHtml = buildSelfContainedHTML(); } catch (e) { lastSavedHtml = ''; }
    autoSaveReady = true;

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && dirtyToFile) doAutoSave();
    });
    window.addEventListener('beforeunload', (event) => {
      if (dirtyToFile && !fileHandle) {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    if (!FS_API) {
      // No File System Access API (Firefox/Safari or an in-editor preview):
      // we cannot write to the file automatically. Be honest and offer a
      // one-click manual save. localStorage still keeps state for this same
      // file location between reopens.
      setStatus(dirtyToFile ? 'Unsaved \u2014 click Save' : 'Not saved to file', 'pending');
      showAutoSaveBar('This browser can\u2019t auto-save to the file. Open it in Chrome or Edge for automatic saving, or click Save now to keep your work.', 'Save now', manualSaveNow);
      return;
    }
    setInterval(() => { if (fileHandle) doAutoSave(); }, 30000);
    const saved = await idbGet(HANDLE_KEY);
    if (saved) {
      setStatus('AutoSave paused', 'pending');
      showAutoSaveBar('Resume saving your work straight to this file?', 'Resume AutoSave', async () => {
        try {
          const perm = saved.requestPermission ? await saved.requestPermission({ mode: 'readwrite' }) : 'granted';
          if (perm === 'granted') {
            fileHandle = saved;
            hideAutoSaveBar();
            lastSavedHtml = '';
            await doAutoSave();
          }
        } catch (e) {}
      });
    } else {
      setStatus('Not saving to file yet', 'pending');
      showAutoSaveBar('Turn on autosave so your work writes straight to this file.', 'Turn on AutoSave', turnOnFileAutoSave);
    }
  }

  const host = document.getElementById('sheets');
  host.innerHTML = '';
  for (let s = 0; s < SHEET_COUNT; s++) {
    host.appendChild(buildSheet());
  }

  // Insert instruments grouped like the preamp legend, but without an outer boxed container

  // Replace static .legend-item nodes with programmatic legend badges
  function upgradeLegendItems() {
    const items = Array.from(document.querySelectorAll('.legend-item'));
    items.forEach(it => {
      const text = it.textContent.trim();
      const type = it.dataset.type || 'instrument';
      const badge = createLegendBadge(text, type);

      it.replaceWith(badge);

  upgradeLegendItems();
  // re-run drag/drop wiring so newly-created legend-badges get listeners
  setupDragAndDrop(document);

  // Persistence: save/load grid state to localStorage
  function saveGridState() {
    try {
      const sheets = Array.from(document.querySelectorAll('.sheet'));
      const out = sheets.map(sheet => Array.from(sheet.querySelectorAll('.grid-body tr')).map(tr => {
        const tds = tr.querySelectorAll('td');
        const serializeCableCell = (cell) => {
          const badges = cell.querySelectorAll ? cell.querySelectorAll('.cable-badge') : [];
          return badges.length
            ? Array.from(badges).map(b => b.dataset.cable || b.textContent.trim()).join(',')
            : cell.textContent.trim();
        };
        return {
          cable: serializeCableCell(tds[0]),
          instrument: tds[1].textContent.trim(),
          wall: serializeCableCell(tds[2]),
          preamp: tds[3].textContent.trim()
        };
      }));
      localStorage.setItem('micConfigSheets', JSON.stringify(out));
    } catch (e) {
      console.error('saveGridState error', e);
    }
    scheduleSave();
  }

  function loadGridState() {
    try {
      const raw = localStorage.getItem('micConfigSheets');
      if (!raw) return;
      const data = JSON.parse(raw);
      const sheets = Array.from(document.querySelectorAll('.sheet'));
      data.forEach((sheetData, sIdx) => {
        const sheet = sheets[sIdx];
        if (!sheet) return;
        const rows = sheet.querySelectorAll('.grid-body tr');
        sheetData.forEach((rowData, rIdx) => {
          const tr = rows[rIdx];
          if (!tr) return;
          const tds = tr.querySelectorAll('td');
          // restore instrument cell (render as badge if non-empty)
          const instVal = rowData.instrument || '';
          if (instVal && instVal.trim()) {
            tds[1].innerHTML = '';
            tds[1].appendChild(createLegendBadge(instVal.trim(), 'instrument'));
          } else {
            tds[1].textContent = '';
          }
          // Restore cable and wall values, keeping custom labels as plain text.
          const cableVal = rowData.cable === undefined ? String(rIdx + 1) : rowData.cable;
          renderCableCell(tds[0], cableVal);
          const wallVal = (rowData.wall || '').toString().trim();
          renderCableCell(tds[2], wallVal);
          // restore preamp cell as badge if present
          const preVal = rowData.preamp || '';
          if (preVal && preVal.trim()) {
            tds[3].innerHTML = '';
            tds[3].appendChild(createLegendBadge(preVal.trim(), 'preamp'));
          } else {
            tds[3].textContent = '';
          }
        });
      });
    } catch (e) {
      console.error('loadGridState error', e);
    }
  }

  function clearGridState() {
    localStorage.removeItem('micConfigSheets');
    document.querySelectorAll('.grid-body tr').forEach(tr => {
      const tds = tr.querySelectorAll('td');
      const rowNumber = Array.from(tr.parentElement.querySelectorAll('tr')).indexOf(tr) + 1;
      renderCableCell(tds[0], rowNumber);
      tds[1].textContent = '';
      tds[2].textContent = '';
      tds[3].textContent = '';
    });
  }

  // Attach persistence hooks to editable cells and preamp drops
  function setupPersistenceHooks() {
    // editable text cells
    document.querySelectorAll('.editable-cell').forEach(cell => {
      cell.addEventListener('input', () => saveGridState());
      cell.addEventListener('blur', () => saveGridState());
      // observe character data changes (for drops that modify textContent)
      const obs = new MutationObserver(() => saveGridState());
      obs.observe(cell, { characterData: true, childList: true, subtree: true });
    });

    // preamp cells: save when double-click clears or when content changes via drop
    document.querySelectorAll('.preamp-cell').forEach(cell => {
      cell.addEventListener('dblclick', () => { saveGridState(); });
      // observe character data changes (for drops that modify textContent)
      const obs = new MutationObserver(() => saveGridState());
      obs.observe(cell, { characterData: true, childList: true, subtree: true });
    });

    // clear button (no confirmation)
    const clearBtn = document.getElementById('clear-button');
    if (clearBtn) clearBtn.addEventListener('click', () => clearGridState());

    // save-to-file buttons (self-contained state, one per sheet header)
    document.querySelectorAll('.save-file-button').forEach((btn) => btn.addEventListener('click', saveStateToFile));
  }

  // After drag/drop setup, wire persistence and restore any saved state
  setupPersistenceHooks();
  hydrateFromEmbeddedState();
  loadGridState();
  // ensure any numeric wall cells are shown as badges
  normalizeAllWallCells();
  initAutoSave();

  // Align the two legends vertically: make preamp legend match instruments legend top
  function alignLegendsVertically() {
    const instr = document.querySelector('.instruments-legend-slot');
    const pre = document.querySelector('.preamp-legend');
    if (!instr || !pre) return;
    const docTop = document.documentElement.getBoundingClientRect().top;
    const instrTop = Math.round(instr.getBoundingClientRect().top - docTop);
    // apply as inline style so sticky respects the computed offset
    pre.style.top = instrTop + 'px';
    instr.style.top = instrTop + 'px';
  }
  alignLegendsVertically();
  window.addEventListener('resize', () => { setTimeout(alignLegendsVertically, 50); });

  // Logo inlined; loader removed.
</script>
