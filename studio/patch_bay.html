<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperThreat Studios — Patch Bay</title>
  <style>
    :root {
      --bg: #08101f;
      --panel: #111c34;
      --border: #2f4c78;
      --text: #e7efff;
      --muted: #8fa6c2;
      --accent: #7c95ff;
      --hole: #0f1a30;
      --hole-border: #3858a2;
      --label: rgba(255,255,255,0.88);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(124,149,255,0.14), transparent 18%),
                  linear-gradient(180deg, #050b17 0%, #101d33 100%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    .page {
      width: min(100%, 1200px);
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    header.brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.6rem;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0.2rem;
      z-index: 10;
    }
    .logo-wrap img {
      max-height: 2.8rem;
      width: auto;
      display: block;
    }
    .hero-row {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: rgba(124,149,255,0.15);
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 3vw, 2.6rem);
      letter-spacing: -0.04em;
    }
    p.intro {
      margin: 0;
      max-width: 44rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .patchbay-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .label-row,
    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
      margin-bottom: 0.55rem;
    }
    .group {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: auto 1fr;
      gap: 0.28rem;
    }
    .group-drop-labels {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0.35rem;
      width: 100%;
      padding-bottom: 0.15rem;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .group-drop-labels.ghost {
      min-height: 2.4rem;
      padding-bottom: 0;
    }
    .group-drop-labels::-webkit-scrollbar {
      display: none;
      height: 0;
    }
    .group-drop-label {
      display: inline-block;
      box-sizing: border-box;
      width: auto;
      min-width: 0;
      max-width: 100%;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      resize: horizontal;
    }
    .label-row > .group:not(:first-child),
    .row > .group:not(:first-child) {
      border-left: 1px solid rgba(124,149,255,0.18);
      padding-left: 0.55rem;
    }
    .label {
      padding: 0.3rem 0.35rem;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.04);
      color: var(--label);
      font-size: 0.72rem;
      text-align: center;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .hole {
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      background: var(--hole);
      border: 1px solid var(--hole-border);
      box-shadow: inset 0 0.8px 0 rgba(255,255,255,0.08);
    }
    .row-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(124,149,255,0), rgba(124,149,255,0.18), rgba(124,149,255,0));
      margin: 0.55rem 0 0.2rem;
    }
    .layout-note {
      margin-top: 1.5rem;
      padding: 1rem 1rem;
      border-radius: 18px;
      background: rgba(15, 24, 42, 0.75);
      border: 1px dashed rgba(124,149,255,0.35);
      color: var(--muted);
      font-size: 0.95rem;
    }
    .legend-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 1rem;
      margin-top: 1.5rem;
      display: grid;
      gap: 1rem;
    }
    .legend-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
    }
    .legend-title {
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
    }
    .legend-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .legend-controls button {
      padding: 0.65rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
    }
    .legend-controls button:hover {
      background: rgba(255,255,255,0.14);
    }
    .legend-controls input,
    .legend-controls select {
      padding: 0.65rem 0.9rem;
      min-width: 10rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }
    .legend-controls input::placeholder,
    .legend-controls select {
      color: rgba(255,255,255,0.65);
    }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .legend-group {
      display: grid;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
    }
    .legend-group-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .legend-group-items {
      display: grid;
      gap: 0.45rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.85rem;
      min-height: 2.3rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      cursor: grab;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 20px rgba(0,0,0,0.12);
    }
    .legend-item:active {
      cursor: grabbing;
    }
    .group {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: auto 1fr;
      gap: 0.28rem;
      position: relative;
    }
    .group.drop-target {
      outline: 2px dashed rgba(124,149,255,0.65);
      outline-offset: 2px;
    }
    .group-drop-label {
      display: inline-block;
      box-sizing: border-box;
      width: auto;
      min-width: 0;
      max-width: 100%;
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      resize: horizontal;
    }
    .group-drop-label::-webkit-resizer,
    .group-drop-label::-moz-resizer,
    .group-drop-label::-ms-resizer {
      display: none;
    }
    .legend-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .legend-name {
      font-size: 0.92rem;
      line-height: 1.25;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .legend-actions button {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem 0.45rem;
      border-radius: 999px;
    }
    .legend-actions button:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }
    .legend-empty {
      color: var(--muted);
      font-size: 0.95rem;
      padding: 1rem 0;
    }
    .legend-item[data-group="Attenuators"],
    .legend-item[data-group="Summing"],
    .legend-item[data-group="Normal"],
    .legend-item[data-group="Dangerous"],
    .legend-item[data-group="Pre Amps"],
    .legend-item[data-group="Pro Tools"],
    .legend-item[data-group="API"],
    .legend-item[data-group="Neve"],
    .legend-item[data-group="Warm"],
    .legend-item[data-group="Vintech"],
    .legend-item[data-group="X Rack"] {
      background: transparent;
    }
    .legend-item[data-group="Attenuators"] .legend-name,
    .legend-item[data-group="Summing"] .legend-name,
    .legend-item[data-group="Normal"] .legend-name,
    .legend-item[data-group="Dangerous"] .legend-name,
    .legend-item[data-group="Pre Amps"] .legend-name,
    .legend-item[data-group="Pro Tools"] .legend-name,
    .legend-item[data-group="API"] .legend-name,
    .legend-item[data-group="Neve"] .legend-name,
    .legend-item[data-group="Warm"] .legend-name,
    .legend-item[data-group="Vintech"] .legend-name,
    .legend-item[data-group="X Rack"] .legend-name {
      color: var(--text);
    }
    @media (max-width: 900px) {
      .legend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .legend-grid { grid-template-columns: 1fr; }
      .legend-controls input,
      .legend-controls select { min-width: 100%; }
    }
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      .page {
        width: 100%;
        margin: 0;
        padding: 0;
      }
      .patchbay-section {
        background: #fff;
        border-color: #000;
        box-shadow: none;
      }
      .label,
      .hole,
      .group-drop-label,
      .legend-title,
      .legend-item,
      .legend-group-title,
      .legend-name {
        color: #000 !important;
      }
      .hole {
        background: #fff;
        border-color: #000;
      }
      .group-drop-label {
        background: #000 !important;
        color: #fff !important;
        border: 1px solid #000 !important;
      }
      .legend-panel,
      .legend-controls,
      .legend-actions,
      .legend-item,
      .legend-grid,
      .legend-group,
      .legend-empty,
      .footer {
        display: none !important;
      }
      .logo-wrap img {
        max-height: 2rem;
      }
    }
    .footer {
      margin-top: 2.25rem;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }
    @media (max-width: 1050px) {
      .label-row,
      .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .page { padding: 1.5rem 1rem 2rem; }
      .label-row,
      .row { grid-template-columns: 1fr; }
      .group { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.22rem; }
      .label { font-size: 0.62rem; }
      .hole { width: 1.1rem; height: 1.1rem; }
    }
  </style>
</head>

  <script>
    const legendKey = 'patchBayLegendItems';
    const defaultGroupBaseColors = {

      'Custom': '#a8c4ff'
    };

    function shadeHexColor(hex, amount) {
      const normalized = hex.replace('#', '');
      const num = parseInt(normalized, 16);
      let r = (num >> 16) + amount;
      let g = ((num >> 8) & 0x00ff) + amount;
      let b = (num & 0x0000ff) + amount;
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function hexToRgba(hex, alpha) {
      const normalized = hex.replace('#', '');
      const bigint = parseInt(normalized, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function legendItemColor(group, label) {
      const base = defaultGroupBaseColors[group] || defaultGroupBaseColors.Custom;
      if (label.toLowerCase().includes('out')) {
        return shadeHexColor(base, -22);
      }
      if (label.toLowerCase().includes('in')) {
        return shadeHexColor(base, 18);
      }
      return base;
    }

    const defaultLegendItems = [
      { label: 'Attenuators In', group: 'Attenuators', color: legendItemColor('Attenuators', 'Attenuators In') },
      { label: 'Attenuators Out', group: 'Attenuators', color: legendItemColor('Attenuators', 'Attenuators Out') },
      { label: 'Summing In', group: 'Summing', color: legendItemColor('Summing', 'Summing In') },
      { label: 'Summing Out', group: 'Summing', color: legendItemColor('Summing', 'Summing Out') },
      { label: 'Normal', group: 'Normal', color: legendItemColor('Normal', 'Normal') },
      { label: 'Dangerous In', group: 'Dangerous', color: legendItemColor('Dangerous', 'Dangerous In') },
      { label: 'Dangerous Out', group: 'Dangerous', color: legendItemColor('Dangerous', 'Dangerous Out') },
      { label: 'Pre Amps In', group: 'Pre Amps', color: legendItemColor('Pre Amps', 'Pre Amps In') },
      { label: 'Preamps Out', group: 'Pre Amps', color: legendItemColor('Pre Amps', 'Preamps Out') },
      { label: 'Pro Tools In', group: 'Pro Tools', color: legendItemColor('Pro Tools', 'Pro Tools In') },
      { label: 'Pro Tools Out', group: 'Pro Tools', color: legendItemColor('Pro Tools', 'Pro Tools Out') },
      { label: 'API In', group: 'API', color: legendItemColor('API', 'API In') },
      { label: 'API Out', group: 'API', color: legendItemColor('API', 'API Out') },
      { label: 'Neve In', group: 'Neve', color: legendItemColor('Neve', 'Neve In') },
      { label: 'Neve Out', group: 'Neve', color: legendItemColor('Neve', 'Neve Out') },
      { label: 'Warm In', group: 'Warm', color: legendItemColor('Warm', 'Warm In') },
      { label: 'Warm Out', group: 'Warm', color: legendItemColor('Warm', 'Warm Out') },
      { label: 'Vintech In', group: 'Vintech', color: legendItemColor('Vintech', 'Vintech In') },
      { label: 'Vintech Out', group: 'Vintech', color: legendItemColor('Vintech', 'Vintech Out') },
      { label: 'X Rack In', group: 'X Rack', color: legendItemColor('X Rack', 'X Rack In') },
      { label: 'X Rack Out', group: 'X Rack', color: legendItemColor('X Rack', 'X Rack Out') }
    ];

    const legendGrid = document.getElementById('legend-grid');
    const legendEmpty = document.getElementById('legend-empty');
    const legendInput = document.getElementById('legend-item-input');
    const legendColor = document.getElementById('legend-color-input');
    const legendAddButton = document.getElementById('legend-add-button');
    const legendSaveButton = document.getElementById('legend-save-button');
    const legendResetButton = document.getElementById('legend-reset-button');

    function normalizeLegendItem(item) {
      if (!item || typeof item !== 'object') return item;
      if (!item.color || typeof item.color !== 'string') {
        item.color = legendItemColor(item.group || 'Custom', item.label || 'Custom');
      }
      return item;
    }

    function loadLegendItems() {
      const stored = window.localStorage.getItem(legendKey);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed)) {
            const normalized = parsed.map(normalizeLegendItem);
            saveLegendItems(normalized);
            return normalized;
          }
        } catch (error) {
          console.warn('Invalid legend storage', error);
        }
      }
      return defaultLegendItems.slice().map(normalizeLegendItem);
    }

    function saveLegendItems(items) {
      window.localStorage.setItem(legendKey, JSON.stringify(items));
    }

    const assignmentKey = 'patchBayGroupAssignments';

    function loadGroupAssignments() {
      const stored = window.localStorage.getItem(assignmentKey);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
        } catch (error) {
          console.warn('Invalid group assignment storage', error);
        }
      }
      return {};
    }

    function saveGroupAssignments(assignments) {
      window.localStorage.setItem(assignmentKey, JSON.stringify(assignments));
    }

    function persistPatchBayState() {
      saveLegendItems(loadLegendItems());
      saveGroupAssignments(loadGroupAssignments());
    }

    function resetPatchBayState() {
      window.localStorage.removeItem(legendKey);
      window.localStorage.removeItem(assignmentKey);
      legendColor.value = '#c2c0ff';
      renderLegend(loadLegendItems());
      renderGroupAssignments();
    }

    function updateGroupLabel(group, assignment, preserveRowGap = false) {
      const existingWrapper = group.querySelector('.group-drop-labels');
      if (existingWrapper) existingWrapper.remove();
      if ((assignment && assignment.length > 0) || preserveRowGap) {
        const wrapper = document.createElement('div');
        wrapper.className = 'group-drop-labels';
        if (!assignment || assignment.length === 0) {
          wrapper.classList.add('ghost');
        } else {
          assignment.forEach((item) => {
            const labelEl = document.createElement('div');
            labelEl.className = 'group-drop-label';
            labelEl.textContent = item.label;
            if (item.color) {
              labelEl.style.background = hexToRgba(item.color, 0.38);
              labelEl.style.border = `1px solid ${hexToRgba(item.color, 0.75)}`;
            } else {
              labelEl.style.background = 'rgba(255,255,255,0.08)';
              labelEl.style.border = '1px solid rgba(255,255,255,0.16)';
            }
            wrapper.appendChild(labelEl);
          });
        }
        group.appendChild(wrapper);
      }
    }

    function renderGroupAssignments() {
      const assignments = loadGroupAssignments();
      const rows = document.querySelectorAll('.patchbay-section .row');
      rows.forEach((row) => {
        const groups = Array.from(row.querySelectorAll('.group'));
        const rowHasAssignments = groups.some((group) => {
          const assignment = assignments[group.dataset.groupId];
          return assignment && assignment.length > 0;
        });
        groups.forEach((group) => {
          const assignment = assignments[group.dataset.groupId];
          updateGroupLabel(group, assignment, rowHasAssignments);
        });

        const wrappers = groups.map((group) => group.querySelector('.group-drop-labels')).filter(Boolean);
        if (wrappers.length > 0) {
          const maxHeight = Math.max(...wrappers.map((wrapper) => wrapper.offsetHeight));
          wrappers.forEach((wrapper) => {
            wrapper.style.height = `${maxHeight}px`;
          });
        }
      });
    }

    function assignLegendToGroup(groupId, item) {
      const assignments = loadGroupAssignments();
      const groupItems = assignments[groupId] || [];
      const existing = groupItems.some((entry) => entry.label === item.label);
      if (!existing) {
        groupItems.push({ label: item.label, color: item.color, start: 1, width: 8 });
        assignments[groupId] = groupItems;
        saveGroupAssignments(assignments);
        renderGroupAssignments();
      }
    }

    function setupPatchBayGroups() {
      const groups = document.querySelectorAll('.patchbay-section .row .group');
      groups.forEach((group, index) => {
        const groupId = `patch-group-${index + 1}`;
        group.dataset.groupId = groupId;

        group.addEventListener('dragenter', (event) => {
          event.preventDefault();
          group.classList.add('drop-target');
        });

        group.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'copy';
          group.classList.add('drop-target');
        });

        group.addEventListener('dragleave', () => {
          group.classList.remove('drop-target');
        });

        group.addEventListener('drop', (event) => {
          event.preventDefault();
          group.classList.remove('drop-target');
          const payload = event.dataTransfer.getData('text/plain');
          if (!payload) return;
          try {
            const item = JSON.parse(payload);
            if (item && item.label) {
              assignLegendToGroup(groupId, item);
            }
          } catch (error) {
            console.warn('Invalid legend drop payload', error);
          }
        });

        group.addEventListener('dblclick', () => {
          const assignments = loadGroupAssignments();
          delete assignments[groupId];
          saveGroupAssignments(assignments);
          renderGroupAssignments();
        });
      });
    }

    function groupedLegendItems(items) {
      return items.reduce((groups, item, index) => {
        if (!groups[item.group]) {
          groups[item.group] = [];
        }
        groups[item.group].push({ item, index });
        return groups;
      }, {});
    }

    function createLegendElement(item, index, items) {
      const wrapper = document.createElement('div');
      wrapper.className = 'legend-item';
      wrapper.draggable = true;
      wrapper.dataset.group = item.group;
      if (item.color) {
        wrapper.style.background = item.color + '44';
        wrapper.style.borderColor = item.color + '88';
        wrapper.style.boxShadow = `inset 0 0 0 1px ${item.color + '88'}, 0 8px 16px rgba(0,0,0,0.14)`;
      }

      wrapper.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('text/plain', JSON.stringify({ label: item.label, color: item.color }));
        event.dataTransfer.effectAllowed = 'copy';
        wrapper.classList.add('dragging');
      });
      wrapper.addEventListener('dragend', () => {
        wrapper.classList.remove('dragging');
      });

      const label = document.createElement('div');
      label.className = 'legend-label';

      const name = document.createElement('span');
      name.className = 'legend-name';
      name.textContent = item.label;
      label.appendChild(name);
      wrapper.appendChild(label);

      const actions = document.createElement('div');
      actions.className = 'legend-actions';
      const removeButton = document.createElement('button');
      removeButton.type = 'button';
      removeButton.textContent = 'Remove';
      removeButton.addEventListener('click', () => {
        items.splice(index, 1);
        saveLegendItems(items);
        renderLegend(items);
      });
      actions.appendChild(removeButton);
      wrapper.appendChild(actions);
      return wrapper;
    }

    function createLegendGroup(name, items, allItems) {
      const groupCard = document.createElement('div');
      groupCard.className = 'legend-group';
      const groupTitle = document.createElement('div');
      groupTitle.className = 'legend-group-title';
      groupTitle.textContent = name;
      groupCard.appendChild(groupTitle);

      const itemsContainer = document.createElement('div');
      itemsContainer.className = 'legend-group-items';
      items.forEach(({ item, index }) => {
        itemsContainer.appendChild(createLegendElement(item, index, allItems));
      });
      groupCard.appendChild(itemsContainer);
      return groupCard;
    }

    function renderLegend(items) {
      legendGrid.innerHTML = '';
      if (items.length === 0) {
        legendEmpty.style.display = 'block';
        return;
      }
      legendEmpty.style.display = 'none';
      const groups = groupedLegendItems(items);
      Object.keys(groups)
        .sort()
        .forEach((groupName) => {
          legendGrid.appendChild(createLegendGroup(groupName, groups[groupName], items));
        });
    }

    function addLegendItem() {
      const customLabel = legendInput.value.trim();
      const colorValue = legendColor.value;
      if (!customLabel) {
        legendInput.focus();
        return;
      }
      const items = loadLegendItems();
      items.push({ label: customLabel, group: 'Custom', color: colorValue });
      saveLegendItems(items);
      renderLegend(items);
      legendInput.value = '';
      legendInput.focus();
    }

    legendAddButton.addEventListener('click', addLegendItem);
    legendSaveButton.addEventListener('click', () => {
      persistPatchBayState();
    });
    legendResetButton.addEventListener('click', () => {
      resetPatchBayState();
    });
    legendInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        addLegendItem();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupPatchBayGroups();
      renderLegend(loadLegendItems());
      renderGroupAssignments();
    });
  </script>
</body>
</html>
